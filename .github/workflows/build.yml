name: build-windows
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd src-rust
          if (Test-Path .cargo\config.toml) { Remove-Item .cargo\config.toml }
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownTabs-exe
          path: src-rust/target/release/MarkdownTabs.exe
